<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ロゴの動き 見本</title>
<style>
/*
  あつまれ、あれこれ：ロゴの動き（扉の代わり）見本 / Claude チャット 2026-10-26
  ・半円3つが右から順に「あつまって」重なる → 「あ」がはずんで出る → 英字 → 少し止まる → 入口へ
  ・使う曲線は正本の3つだけ：--ease-out(.32,.72,0,1) / --ease-spring(.2,1.6,.4,1) / ease
  ・点滅なし・揺れなし。演出「なし」では動かさず、すぐ入口へ
  ・押すと飛ばせる
  ・形はくまくんのアイコンの SVG（docs/ロゴ/アイコン.svg）そのまま。影は付けない（動く時にくっきり見せるため）
  時間（ふつう）：
    0.00 薄い半円  0.08 中の半円  0.16 濃い半円（各0.42秒）
    0.36 「あ」（0.40秒・はずむ）
    0.62 英字（0.25秒）
    1.30 全体が少し大きくなって消える（0.25秒）→ 1.55 入口
*/
:root{
  --bg:#FFF6DA;
  --ink:#111;
  --y1a:#FDD020; --y1b:#FEDF5C;
  --y2:#FEE56E;
  --y3:#FEEC8E;
  --ease-out:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.2,1.6,.4,1);
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.logo{width:min(62vmin,520px);height:auto;display:block}
.logo .s{transform-box:fill-box;transform-origin:right center}
.logo .a,.logo .w{transform-box:fill-box;transform-origin:50% 55%}
/* ふつう */
.play .s3{animation:inR .42s var(--ease-out) 0s both}
.play .s2{animation:inR .42s var(--ease-out) .08s both}
.play .s1{animation:inR .42s var(--ease-out) .16s both}
.play .a {animation:pop .40s var(--ease-spring) .36s both}
.play .w {animation:up .25s ease .62s both}
.play.out .logo{animation:leave .25s ease forwards}
@keyframes inR{from{opacity:0;transform:translateX(18%)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:scale(1.04)}}
/* 見本のための操作（アプリには入れない） */
.ui{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
.ui button{font:600 14px system-ui;padding:10px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.ui button[aria-pressed=true]{background:var(--ink);color:#fff}
.entry{position:fixed;inset:0;display:grid;place-items:center;font:800 clamp(28px,7vmin,64px) system-ui,sans-serif;opacity:0;transition:opacity .25s ease;pointer-events:none}
.entry.on{opacity:1}
.entry small{display:block;font:600 14px system-ui;text-align:center;margin-top:8px;opacity:.6}
</style>
</head>

<div class="entry" id="entry"><div>あつまれ、あれこれ<small>（ここから入口の画面）</small></div></div>
<div class="ui">
  <button id="replay">もう一度</button>
  <button id="normal" aria-pressed="true">演出 ふつう</button>
  <button id="none" aria-pressed="false">演出 なし</button>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'), entry=document.getElementById('entry');
  var fx='normal', timers=[];
  function clear(){timers.forEach(clearTimeout);timers=[];}
  function toEntry(){clear();stage.classList.add('out');timers.push(setTimeout(function(){stage.style.visibility='hidden';entry.classList.add('on');},250));}
  function run(){
    clear();entry.classList.remove('on');stage.style.visibility='';
    stage.classList.remove('play','out');void stage.offsetWidth;
    if(fx==='none'){stage.style.visibility='hidden';entry.classList.add('on');return;}
    stage.classList.add('play');
    timers.push(setTimeout(toEntry,1300));
  }
  stage.addEventListener('click',function(){if(stage.classList.contains('play')&&!stage.classList.contains('out'))toEntry();});
  document.getElementById('replay').onclick=run;
  ['normal','none'].forEach(function(k){document.getElementById(k).onclick=function(){fx=k;
    document.getElementById('normal').setAttribute('aria-pressed',k==='normal');
    document.getElementById('none').setAttribute('aria-pressed',k==='none');run();};});
  run();
})();
</script>
